# Mi 10T: bluebinder_wait.sh expects exactly one running init.svc.*bluetooth service, but MIUI runs two
# (vendor.bluetooth-1-0-qti and vendor.xiaomi.cit.bluetooth) -> it waits forever. Wait for the HCI HAL only.
# The HAL reads the factory BD address from the external modem's NV (QMI) once, when bluebinder opens it; too
# early and it falls back to a placeholder (FF:DD:...) -> also wait until qcril finished its QMI pre-init
# (vendor.radio.qcril_pre_init_lock_held=0), at most 90 s.
[Service]
TimeoutStartSec=150
ExecStartPre=
ExecStartPre=/bin/sh -c 'until [ "$(/usr/bin/getprop init.svc.vendor.bluetooth-1-0-qti)" = running ]; do sleep 1; done'
ExecStartPre=/bin/sh -c 'i=0; until [ "$(/usr/bin/getprop vendor.radio.qcril_pre_init_lock_held)" = 0 ] || [ $i -ge 90 ]; do i=$((i+1)); sleep 1; done'
