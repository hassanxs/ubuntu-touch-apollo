# Mi 10T: start the port's units. The overlay (and its multi-user.target.wants links) only appears after
# mount-halium-overlay's daemon-reload, when the boot transaction is already built, so those links do not get
# the units started on a fresh install. lxc-android-config itself starts after the reload and reads this drop-in.
[Service]
ExecStartPre=-/bin/systemctl --no-block start apollo-wlan-on.service apollo-audio-policy.service mi-touch-edge.service apollo-audio-hw-socket.service
