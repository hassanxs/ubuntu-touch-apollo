# Mi 10T (apollo): oFono itself uses ofono-binder-plugin (/etc/ofono/binder.conf).
# This file is read by audiosystem-passthrough (type=qti) to find the IQcRilAudio
# instances (vendor.qti.hardware.radio.am@1.0::IQcRilAudio/slot1, /slot2) that let
# qcrild start/stop voice calls in the audio HAL.
[Settings]

[ril_0]
transport=binder:name=slot1

[ril_1]
transport=binder:name=slot2
