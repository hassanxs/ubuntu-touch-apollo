# Mi 10T (apollo): Halium 12 system (Android 12, API 32). Without this libgbinder speaks the Android 8-10
# AIDL protocol on /dev/binder and audiosystem-passthrough (type af) cannot register media.audio_flinger
# (video recording hangs). See the comments of the stock /etc/gbinder.conf for the format.
[General]
ApiLevel = 32
